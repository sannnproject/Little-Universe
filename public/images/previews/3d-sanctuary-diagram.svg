<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100C18"/>
      <stop offset="50%" stop-color="#1E1128"/>
      <stop offset="100%" stop-color="#120B1B"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F2A7B8" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#722F47" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#100C18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EF"/>
      <stop offset="50%" stop-color="#E6C99A"/>
      <stop offset="100%" stop-color="#9A7B4F"/>
    </linearGradient>
    <linearGradient id="roseRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EF"/>
      <stop offset="50%" stop-color="#F2A7B8"/>
      <stop offset="100%" stop-color="#722F47"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" rx="20"/>
  <rect width="1200" height="630" fill="url(#coreGlow)" rx="20"/>

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#E6C99A" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Observatory Terrace Base -->
  <ellipse cx="600" cy="495" rx="340" ry="68" fill="#1B1124" stroke="url(#goldRing)" stroke-width="2.5"/>
  <ellipse cx="600" cy="488" rx="230" ry="42" fill="#140C1C" stroke="#F2A7B8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Stone Observatory Archway -->
  <path d="M460 470 L460 220 A140 140 0 0 1 740 220 L740 470" fill="none" stroke="url(#goldRing)" stroke-width="10" stroke-opacity="0.5"/>

  <!-- Outer Meridian Ring -->
  <circle cx="600" cy="295" r="132" fill="none" stroke="url(#goldRing)" stroke-width="6"/>
  <!-- Tilted Equinox Rose-Gold Ring -->
  <ellipse cx="600" cy="295" rx="108" ry="64" transform="rotate(-24 600 295)" fill="none" stroke="url(#roseRing)" stroke-width="5"/>
  <!-- Inner Gimbal Ring -->
  <ellipse cx="600" cy="295" rx="54" ry="86" transform="rotate(18 600 295)" fill="none" stroke="#E6C99A" stroke-width="3" stroke-opacity="0.85"/>

  <!-- 3D Crystal Heart Core -->
  <path d="M600 338 C600 338 546 300 546 266 C546 244 564 232 582 232 C593 232 600 242 600 242 C600 242 607 232 618 232 C636 232 654 244 654 266 C654 300 600 338 600 338 Z" fill="url(#roseRing)" stroke="#FFF5EF" stroke-width="2"/>

  <!-- Stepped Lathe Pedestal -->
  <path d="M530 475 L670 475 L650 432 L550 432 Z" fill="#251529" stroke="#E6C99A" stroke-width="2"/>
  <ellipse cx="600" cy="432" rx="68" ry="14" fill="#181022" stroke="#E6C99A" stroke-width="2"/>

  <!-- Callout Labels -->
  <g font-family="sans-serif" font-size="13" fill="#FFF5EF">
    <!-- Top Left Header -->
    <text x="48" y="54" fill="#E6C99A" font-size="12" letter-spacing="3" font-weight="bold">THREE.JS WEBGL STUDIO PBR ARCHITECTURE</text>
    <text x="48" y="86" fill="#FFF5EF" font-size="26" font-family="Georgia, serif" font-style="italic">A Little Universe, Just for You — 3D Sanctuary</text>

    <!-- Callout 1: Crystal Heart -->
    <line x1="652" y1="265" x2="815" y2="215" stroke="#F2A7B8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="652" cy="265" r="4" fill="#F2A7B8"/>
    <rect x="820" y="188" width="320" height="58" rx="10" fill="#181022" stroke="#F2A7B8" stroke-opacity="0.45"/>
    <text x="836" y="212" fill="#F2A7B8" font-weight="bold">7. Sculpted 3D Crystal Heart Core</text>
    <text x="836" y="232" fill="#FFF5EF" fill-opacity="0.8" font-size="12">ExtrudeGeometry + MeshPhysicalMaterial (IOR 1.65)</text>

    <!-- Callout 2: Gimbal Rings -->
    <line x1="726" y1="332" x2="815" y2="332" stroke="#E6C99A" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="726" cy="332" r="4" fill="#E6C99A"/>
    <rect x="820" y="305" width="320" height="58" rx="10" fill="#181022" stroke="#E6C99A" stroke-opacity="0.45"/>
    <text x="836" y="329" fill="#E6C99A" font-weight="bold">4–6. Multi-Axis Celestial Astrolabe Rings</text>
    <text x="836" y="349" fill="#FFF5EF" fill-opacity="0.8" font-size="12">Brushed Champagne Gold &amp; Rose-Gold PBR</text>

    <!-- Callout 3: Couple Bench & Lantern -->
    <line x1="450" y1="455" x2="355" y2="385" stroke="#E6C99A" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="450" cy="455" r="4" fill="#E6C99A"/>
    <rect x="48" y="355" width="302" height="58" rx="10" fill="#181022" stroke="#E6C99A" stroke-opacity="0.45"/>
    <text x="64" y="379" fill="#E6C99A" font-weight="bold">8-Part Sunset Bench &amp; Couple</text>
    <text x="64" y="399" fill="#FFF5EF" fill-opacity="0.8" font-size="12">Grounded Contact Shadows + Warm Lantern</text>

    <!-- Callout 4: Instanced Starfield -->
    <rect x="48" y="235" width="302" height="58" rx="10" fill="#181022" stroke="#F2A7B8" stroke-opacity="0.35"/>
    <text x="64" y="259" fill="#F2A7B8" font-weight="bold">160x THREE.InstancedMesh Starfield</text>
    <text x="64" y="279" fill="#FFF5EF" fill-opacity="0.8" font-size="12">RoomEnvironment PMREM + Exponential Damping</text>

    <!-- Footer Credit -->
    <text x="48" y="592" fill="#E6C99A" font-size="12" letter-spacing="2">CRAFTED BY SANN404 FORUM GROUP</text>
  </g>
